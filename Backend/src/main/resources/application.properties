server.port=9090
spring.application.name=legalbot
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

## AI model configuration (Gemma)
spring.ai.google.genai.api-key=${AI_API_KEY}
spring.ai.google.genai.chat.options.model=gemma-4-31b-it
spring.ai.ollama.chat.options.model=gemma2

## Application Debug Logging
logging.level.com.legal.legalbot=DEBUG
logging.level.com.legal.legalbot.services.ai=DEBUG
logging.level.org.springframework.ai=DEBUG